<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แนะนำอาหารไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>🌶️ วันนี้กินอะไรดี</h1>
    <p>แนะนำอาหารไทย 10 เมนู สุ่มเมนูวันนี้ และเก็บเมนูโปรดของคุณ</p>
    <button id="drawBtn" class="draw-btn" type="button">🎲 สุ่มอาหารไทยวันนี้</button>
  </header>

  <div id="warn" class="warn" role="status">บันทึกไม่ได้ในเบราว์เซอร์นี้ รายการโปรดจะหายเมื่อรีเฟรชหน้า</div>

  <section class="today" id="today" aria-live="polite"></section>

  <h2>❤️ รายการโปรดของฉัน <span class="count" id="favCount">0</span></h2>
  <section id="favs"></section>

  <h2>📖 เมนูอาหารไทย</h2>
  <div class="search" role="search">
    <span class="icon" aria-hidden="true">🔍</span>
    <input id="q" type="search" autocomplete="off" placeholder="ค้นหาเมนู เช่น ต้มยำ, curry, กะทิ, อีสาน"
           aria-label="ค้นหาเมนูอาหาร">
    <button type="button" class="clear" id="qClear" hidden>ล้าง</button>
  </div>
  <div class="filter-row"><span class="lbl">หมวด</span><div class="chips" id="chips" role="group" aria-label="กรองตามหมวด"></div></div>
  <div class="filter-row"><span class="lbl">ภาค</span><div class="chips" id="regionChips" role="group" aria-label="กรองตามภาค"></div></div>
  <div class="filter-row"><span class="lbl">ความเผ็ด</span><div class="chips" id="spiceChips" role="group" aria-label="กรองตามความเผ็ด"></div></div>
  <div class="result-bar">
    <span id="resultCount"></span>
    <button type="button" class="reset" id="resetBtn" hidden>ล้างตัวกรองทั้งหมด</button>
  </div>
  <section class="grid" id="catalog"></section>


  <footer>ข้อมูลรายการโปรดเก็บในเบราว์เซอร์ของคุณเท่านั้น</footer>
</div>

<script src="common.js"></script>
<script>
(function () {
  "use strict";

  var F = window.ThaiFood;
  var CATALOG = F.CATALOG, BY_ID = F.BY_ID, spiceHtml = F.spiceHtml;

  var CATEGORIES = ["ทั้งหมด", "ต้ม", "ผัด", "แกง", "ยำ", "ทอด", "ของหวาน"];

  var favorites = [];       // รหัสเมนู ล่าสุดก่อน
  var REGIONS = ["ทั้งหมด", "เหนือ", "อีสาน", "กลาง", "ใต้"];
  var SPICES = [
    { v: "all", label: "ทั้งหมด" }, { v: "0", label: "ไม่เผ็ด" }, { v: "1", label: "เผ็ดน้อย 🌶" },
    { v: "2", label: "เผ็ดกลาง 🌶🌶" }, { v: "3", label: "เผ็ดมาก 🌶🌶🌶" }
  ];

  var activeCat = "ทั้งหมด";
  var activeRegion = "ทั้งหมด";
  var activeSpice = "all";
  var query = "";
  var todayId = null;
  var drawing = false;

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    draw: $("drawBtn"), today: $("today"), favs: $("favs"), favCount: $("favCount"),
    chips: $("chips"), catalog: $("catalog"), warn: $("warn"),
    q: $("q"), qClear: $("qClear"), regionChips: $("regionChips"), spiceChips: $("spiceChips"),
    resultCount: $("resultCount"), reset: $("resetBtn")
  };

  /* ---------- รายการโปรด (เก็บร่วมกับหน้ารายละเอียดผ่าน common.js) ---------- */
  function loadFavorites() { return F.loadFavorites(); }
  function saveFavorites() {
    F.saveFavorites(favorites);
    els.warn.classList.toggle("show", !F.storageOk());
  }

  /* ---------- rendering ---------- */
  function isFav(id) { return favorites.indexOf(id) !== -1; }

  function heartBtn(d) { return F.heartBtn(d, isFav(d.id)); }


  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  // ไฮไลต์คำค้นในข้อความ (ข้อความมาจาก CATALOG ที่เราเขียนเอง ไม่มี HTML พิเศษ)
  function hl(text, terms) {
    if (!terms || !terms.length) return text;
    var re = new RegExp("(" + terms.map(escRe).join("|") + ")", "gi");
    return text.replace(re, "<mark>$1</mark>");
  }

  function cardHtml(d, extraClass, label, terms) {
    return '<article class="card ' + (extraClass || "") + '">' +
      (label ? '<span class="label">' + label + "</span>" : "") +
      heartBtn(d) +
      '<div class="art' + (d.img ? " has-image" : "") + '" style="--tint:' + d.tint + '"' +
      (d.img ? "" : ' aria-hidden="true"') + '>' +
      (d.img ? '<img src="' + d.img + '" alt="' + d.th + '" loading="lazy">' : d.emoji) + "</div>" +
      '<div class="body"><h3><a class="card-link" href="' + F.menuUrl(d.id) + '">' + hl(d.th, terms) + '</a></h3><div class="en">' + hl(d.en, terms) + "</div>" +
      "<p>" + hl(d.desc, terms) + "</p>" +
      '<div class="meta"><span class="tag">' + hl(d.cat, terms) + '</span><span class="tag">' + hl("ภาค" + d.region, terms) + "</span>" +
      spiceHtml(d.spice) + '</div><span class="more" aria-hidden="true">ดูส่วนประกอบ →</span></div></article>';
  }

  function renderToday() {
    if (!todayId) {
      els.today.innerHTML = '<div class="today-empty"><span class="big">🍽️</span>' +
        "ยังไม่ได้สุ่ม กดปุ่ม “สุ่มอาหารไทยวันนี้” เพื่อดูว่าวันนี้ควรกินอะไร</div>";
      return;
    }
    els.today.innerHTML = cardHtml(BY_ID[todayId], "featured", "เมนูวันนี้");
  }

  function renderFavs() {
    els.favCount.textContent = favorites.length;
    if (!favorites.length) {
      els.favs.innerHTML = '<div class="empty-favs">ยังไม่มีรายการโปรด กดหัวใจ ♡ บนเมนูที่ชอบเพื่อเก็บไว้ที่นี่</div>';
      return;
    }
    els.favs.innerHTML = '<div class="grid small">' +
      favorites.map(function (id) { return cardHtml(BY_ID[id]); }).join("") + "</div>";
  }

  function chipsHtml(attr, items, active) {
    return items.map(function (it) {
      var v = typeof it === "string" ? it : it.v, label = typeof it === "string" ? it : it.label;
      return '<button type="button" class="chip" data-' + attr + '="' + v + '" aria-pressed="' + (v === active) + '">' + label + "</button>";
    }).join("");
  }

  function renderChips() {
    els.chips.innerHTML = chipsHtml("cat", CATEGORIES, activeCat);
    els.regionChips.innerHTML = chipsHtml("region", REGIONS, activeRegion);
    els.spiceChips.innerHTML = chipsHtml("spice", SPICES, activeSpice);
  }

  function searchTerms() {
    return query.toLowerCase().split(/\s+/).filter(Boolean);
  }

  function matches(d, terms) {
    if (activeCat !== "ทั้งหมด" && d.cat !== activeCat) return false;
    if (activeRegion !== "ทั้งหมด" && d.region !== activeRegion) return false;
    if (activeSpice !== "all" && String(d.spice) !== activeSpice) return false;
    if (!terms.length) return true;
    var hay = (d.th + " " + d.en + " " + d.desc + " " + d.cat + " ภาค" + d.region).toLowerCase();
    return terms.every(function (t) { return hay.indexOf(t) !== -1; });
  }

  function isFiltered() {
    return query.trim() !== "" || activeCat !== "ทั้งหมด" || activeRegion !== "ทั้งหมด" || activeSpice !== "all";
  }

  function renderCatalog() {
    var terms = searchTerms();
    var list = CATALOG.filter(function (d) { return matches(d, terms); });
    els.catalog.innerHTML = list.length
      ? list.map(function (d) { return cardHtml(d, "", "", terms); }).join("")
      : '<div class="no-result"><span class="big">🔎</span>ไม่พบเมนูที่ตรงกับเงื่อนไข ลองเปลี่ยนคำค้นหาหรือล้างตัวกรอง</div>';
    els.resultCount.textContent = isFiltered()
      ? "พบ " + list.length + " จาก " + CATALOG.length + " เมนู"
      : "แสดงทั้งหมด " + CATALOG.length + " เมนู";
    els.reset.hidden = !isFiltered();
    els.qClear.hidden = query === "";
  }

  function resetFilters() {
    query = ""; els.q.value = "";
    activeCat = "ทั้งหมด"; activeRegion = "ทั้งหมด"; activeSpice = "all";
    renderChips(); renderCatalog();
  }

  function renderHearts() {
    renderToday(); renderFavs(); renderCatalog();
  }

  /* ---------- actions ---------- */
  function toggleFav(id) {
    if (!BY_ID[id]) return;
    var i = favorites.indexOf(id);
    if (i === -1) favorites.unshift(id); else favorites.splice(i, 1);
    saveFavorites();
    if (drawing) { renderFavs(); renderCatalog(); } else { renderHearts(); }
  }

  function draw() {
    if (drawing) return;
    drawing = true;
    els.draw.disabled = true;

    var pool = CATALOG.filter(function (d) { return d.id !== todayId; });
    var pick = pool[Math.floor(Math.random() * pool.length)];
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var frames = reduce ? 0 : 8;
    var n = 0;

    function finish() {
      todayId = pick.id;
      drawing = false;
      els.draw.disabled = false;
      els.draw.textContent = "🎲 สุ่มใหม่อีกครั้ง";
      renderToday();
    }
    if (!frames) { finish(); return; }

    var timer = setInterval(function () {
      n++;
      if (n > frames) { clearInterval(timer); finish(); return; }
      var d = CATALOG[Math.floor(Math.random() * CATALOG.length)];
      els.today.innerHTML = '<article class="card featured spin"><div class="art" style="--tint:' + d.tint +
        '" aria-hidden="true">' + d.emoji + '</div><div class="body"><h3>' + d.th + "</h3>" +
        '<div class="en">กำลังสุ่ม…</div></div></article>';
    }, 120);
  }

  /* ---------- events ---------- */
  els.draw.addEventListener("click", draw);
  document.addEventListener("click", function (e) {
    var fav = e.target.closest("[data-fav]");
    if (fav) { toggleFav(fav.getAttribute("data-fav")); return; }
    var chip = e.target.closest("[data-cat], [data-region], [data-spice]");
    if (chip) {
      if (chip.hasAttribute("data-cat")) activeCat = chip.getAttribute("data-cat");
      else if (chip.hasAttribute("data-region")) activeRegion = chip.getAttribute("data-region");
      else activeSpice = chip.getAttribute("data-spice");
      renderChips(); renderCatalog();
    }
  });
  els.q.addEventListener("input", function () { query = els.q.value; renderCatalog(); });
  els.q.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && query) { query = ""; els.q.value = ""; renderCatalog(); }
  });
  els.qClear.addEventListener("click", function () { query = ""; els.q.value = ""; renderCatalog(); els.q.focus(); });
  els.reset.addEventListener("click", resetFilters);

  /* ---------- init ---------- */
  // ลิงก์เก่าแบบ #/menu/<id> ส่งต่อไปหน้ารายละเอียด (from=legacy ให้ปุ่มกลับไม่ใช้ history.back())
  var legacy = /^#\/menu\/([\w-]+)$/.exec(window.location.hash);
  if (legacy) { window.location.replace(F.menuUrl(legacy[1]) + "&from=legacy"); return; }

  favorites = loadFavorites();
  els.warn.classList.toggle("show", !F.storageOk());
  query = els.q.value; // เบราว์เซอร์อาจคืนค่าในช่องค้นหาเมื่อรีโหลด
  renderToday(); renderFavs(); renderChips(); renderCatalog();

  // กลับมาจากหน้ารายละเอียด (bfcache) หรือแก้รายการโปรดจากแท็บอื่น ให้หัวใจตรงกันเสมอ
  // ถ้า storage อ่าน/เขียนไม่ได้ ข้อมูลที่ได้จะว่างหรือเก่า จึงคงรายการในหน่วยความจำไว้ ไม่ทับ
  function syncFavorites() {
    var stored = loadFavorites();
    if (!F.storageOk()) return;
    favorites = stored;
    renderHearts();
  }
  window.addEventListener("pageshow", function (e) { if (e.persisted) syncFavorites(); });
  window.addEventListener("storage", function (e) { if (e.key === F.STORAGE_KEY) syncFavorites(); });
})();
</script>
</body>
</html>
