<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดเมนู – แนะนำอาหารไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="warn" class="warn" role="status">บันทึกไม่ได้ในเบราว์เซอร์นี้ รายการโปรดจะหายเมื่อรีเฟรชหน้า</div>

  <main class="detail" id="detail"></main>

  <footer>ข้อมูลรายการโปรดเก็บในเบราว์เซอร์ของคุณเท่านั้น</footer>
</div>

<script src="common.js"></script>
<script>
(function () {
  "use strict";

  var F = window.ThaiFood;
  var BY_ID = F.BY_ID;
  var els = { detail: document.getElementById("detail"), warn: document.getElementById("warn") };
  var BASE_TITLE = "แนะนำอาหารไทย";
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  // มาจากลิงก์เก่าที่ถูก redirect: รายการก่อนหน้าใน history ไม่ใช่หน้าแรกของเว็บนี้
  var viaLegacy = params.get("from") === "legacy";
  var favorites = F.loadFavorites();

  function isFav(id) { return favorites.indexOf(id) !== -1; }

  function backLink() {
    return '<a class="back" id="back" href="index.html">← กลับหน้าเมนู</a>';
  }

  function render() {
    var d = BY_ID[id];
    if (!d) {
      document.title = "ไม่พบเมนู – " + BASE_TITLE;
      els.detail.innerHTML = backLink() +
        '<div class="detail-missing"><span class="big">🔎</span>ไม่พบเมนูที่ต้องการ</div>';
      return;
    }
    document.title = d.th + " – " + BASE_TITLE;
    var groups = d.ing.map(function (g) {
      return '<div class="ing-group"><h3>' + g.g + '</h3><ul class="ing-list">' +
        g.items.map(function (it) {
          return '<li><span>' + it[0] + '</span><span class="amt">' + it[1] + "</span></li>";
        }).join("") + "</ul></div>";
    }).join("");
    els.detail.innerHTML = backLink() +
      '<article class="card">' + F.heartBtn(d, isFav(d.id)) +
      '<div class="art' + (d.img ? " has-image" : "") + '" style="--tint:' + d.tint + '"' + (d.img ? "" : ' aria-hidden="true"') + ">" +
      (d.img ? '<img src="' + d.img + '" alt="' + d.th + '">' : d.emoji) + "</div>" +
      '<div class="body"><h1>' + d.th + '</h1><div class="en">' + d.en + "</div>" +
      '<div class="meta"><span class="tag">' + d.cat + '</span><span class="tag">ภาค' + d.region + "</span>" + F.spiceHtml(d.spice) + "</div>" +
      '<p class="lead">' + d.desc + "</p>" +
      "<h2>🧺 ส่วนประกอบ</h2>" +
      '<p class="serving">ปริมาณโดยประมาณสำหรับ 2 ที่ ปรับตามรสนิยมได้</p>' + groups +
      "</div></article>";
  }

  function toggleFav() {
    if (!BY_ID[id]) return;
    var i = favorites.indexOf(id);
    if (i === -1) favorites.unshift(id); else favorites.splice(i, 1);
    F.saveFavorites(favorites);
    els.warn.classList.toggle("show", !F.storageOk());
    render();
    var b = els.detail.querySelector("[data-fav]");
    if (b) b.focus();
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-fav]")) { toggleFav(); return; }
    // ถ้ามาจากหน้าแรกของเว็บนี้ ให้ย้อนกลับ เพื่อคงตำแหน่งเลื่อนและตัวกรองเดิมไว้
    if (e.target.closest("#back") && !viaLegacy && window.history.length > 1 && document.referrer &&
        document.referrer.indexOf(window.location.origin) === 0 && !/menu\.html/.test(document.referrer)) {
      e.preventDefault();
      window.history.back();
    }
  });
  // แก้รายการโปรดจากแท็บอื่น ให้หัวใจตรงกัน
  window.addEventListener("storage", function (e) {
    if (e.key === F.STORAGE_KEY) { favorites = F.loadFavorites(); render(); }
  });

  els.warn.classList.toggle("show", !F.storageOk());
  render();
})();
</script>
</body>
</html>
